# Generates PocketStep.xcodeproj. After adding or removing source files run:
#   cd ios && xcodegen generate
name: PocketStep
options:
  bundleIdPrefix: org.pocketstep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketStep:
    type: application
    platform: iOS
    sources:
      - path: PocketStep/App
      - path: PocketStep/Models
      - path: PocketStep/Services
      - path: PocketStep/Views
    info:
      path: PocketStep/App/Info.plist
      properties:
        CFBundleDisplayName: PocketStep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMotionUsageDescription: PocketStep uses Motion & Fitness data to show pedometer step counts as a reference while it records accelerometer data for research.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [accelerometer]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pocketstep.PocketStep
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  PocketStepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketStep/Tests
    dependencies:
      - target: PocketStep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pocketstep.PocketStepTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketStep:
    build:
      targets:
        PocketStep: all
        PocketStepTests: [test]
    test:
      targets:
        - PocketStepTests
