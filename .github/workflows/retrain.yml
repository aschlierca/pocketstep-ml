# Retrains the published model whenever new data or pipeline code reaches main, then commits
# ml/published/ back to the repository. Pushes made with GITHUB_TOKEN do not trigger workflows,
# so the commit below cannot start another run.
name: Retrain published model

on:
  push:
    branches: [main]
    paths:
      - "ml/data/raw/**"
      - "ml/src/**"
      - "ml/requirements.txt"
      - ".github/workflows/retrain.yml"
  workflow_dispatch:

permissions:
  contents: write

# One retrain at a time; a queued run trains on the newest main, including earlier results.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Retrain and evaluate
        run: python -m ml.src.retrain

      - name: Commit published model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/published
          # Ignore the timestamp line so a run that changes nothing else does not commit.
          if git diff --cached --quiet -I '^- Updated: '; then
            echo "No changes to publish."
            exit 0
          fi
          sessions=$(find ml/data/raw -name sensor_data.csv | wc -l | tr -d ' ')
          git commit -m "Retrain published model on ${sessions} session(s)" \
                     -m "Automated run of python -m ml.src.retrain for ${GITHUB_SHA::7}."
          git pull --rebase
          git push

      - name: Show status
        run: cat ml/published/README.md >> "$GITHUB_STEP_SUMMARY"
